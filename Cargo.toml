[package]
name = "rucash"
version = "0.8.0"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/z-Wind/rucash"
description = "read Gnucash file"
keywords = ["gnucash"]
categories = ["database"]
authors = ["zWindr <zpsyhapcst@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
sqlx = { version = "0.9", optional = true }
# sqlx = { git = "https://github.com/launchbadge/sqlx.git", optional = true }
chrono = "0.4"
rust_decimal = { version = "1.42", optional = true }
roxmltree = { version = "0.21", optional = true }
flate2 = "1.1"
tokio = { version = "1.53", features = ["sync"] }
num-traits = "0.2"
thiserror = "2.0"
# rusqlite is capped below 0.40 on purpose. This is NOT about whether our
# own `schema`/`sqlite` features ever turn on `sqlx/sqlite` — Cargo's
# resolver builds its dependency graph "as if all features were enabled"
# purely to compute a valid Cargo.lock (see
# https://doc.rust-lang.org/cargo/reference/resolver.html#links), so the
# mere fact that `sqlx` (used for mysql/postgres) *could* pull in
# `sqlx-sqlite` under some feature combination is enough to trigger a
# `links = "sqlite3"` conflict with rusqlite's own bundled libsqlite3-sys,
# regardless of which features we actually select. Known, still-open Cargo
# limitation: https://github.com/rust-lang/cargo/issues/14494
#
# sqlx-sqlite 0.9.0 requires `libsqlite3-sys >=0.30.1, <0.38.0`. rusqlite
# 0.39.0 is the newest release whose own requirement (`^0.37.0`) still
# falls inside that range, so Cargo can settle on one shared
# libsqlite3-sys (0.37.x) instead of erroring. Re-check this cap next time
# sqlx-sqlite raises its libsqlite3-sys ceiling.
rusqlite = { version = "0.39", features = [
    "bundled",
    "chrono",
], optional = true }
r2d2 = "0.8"
tracing = { version = "0.1", features = ["log"] }

[lib]
name = "rucash"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
float-cmp = "0.10"
pretty_assertions = "1.4"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
test-log = { version = "0.2", default-features = false, features = ["trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = []
schema = ["sqlx_common"]
sqlx_common = ["sqlx/any", "sqlx/runtime-tokio", "sqlx/macros", "sqlx/chrono"]
sqlite = ["rusqlite"]
postgresql = ["sqlx_common", "sqlx/postgres"]
mysql = ["sqlx_common", "sqlx/mysql"]
xml = ["roxmltree"]
decimal = ["rust_decimal"]

[[bench]]
name = "benchmark"
harness = false
required-features = ["sqlite", "xml"]

[[test]]
name = "sqlite"
path = "tests/sqlite.rs"
required-features = ["sqlite"]

[[test]]
name = "mysql"
path = "tests/mysql.rs"
required-features = ["mysql"]

[[test]]
name = "xml"
path = "tests/xml.rs"
required-features = ["xml"]

[[test]]
name = "postgresql"
path = "tests/postgresql.rs"
required-features = ["postgresql"]

[[test]]
name = "all"
path = "tests/all.rs"
required-features = ["sqlite", "postgresql", "mysql", "xml"]
