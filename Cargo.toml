[package]
name = "rucash"
version = "0.8.0"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/z-Wind/rucash"
description = "read Gnucash file"
keywords = ["gnucash"]
categories = ["database"]
authors = ["zWindr <zpsyhapcst@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
sqlx = { version = "0.9", optional = true }
# sqlx = { git = "https://github.com/launchbadge/sqlx.git", optional = true }
chrono = "0.4"
rust_decimal = { version = "1.42", optional = true }
roxmltree = { version = "0.21", optional = true }
flate2 = "1.1"
tokio = { version = "1.53", features = ["sync"] }
num-traits = "0.2"
thiserror = "2.0"
# rusqlite is capped at 0.39 (not the newest 0.40.x) because sqlx-sqlite 0.9.0
# still requires `libsqlite3-sys >=0.30.1, <0.38.0`, while rusqlite 0.40.x
# requires `libsqlite3-sys ^0.38.1`. 0.39.0 is the newest rusqlite whose
# libsqlite3-sys requirement (^0.37.0) still overlaps sqlx's range, so Cargo
# can unify on a single libsqlite3-sys (0.37.x) instead of erroring or
# linking two copies of bundled SQLite into the same binary.
# Re-check this cap next time sqlx-sqlite raises its libsqlite3-sys ceiling.
rusqlite = { version = "0.39", features = [
    "bundled",
    "chrono",
], optional = true }
r2d2 = "0.8"
tracing = { version = "0.1", features = ["log"] }

[lib]
name = "rucash"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
float-cmp = "0.10"
pretty_assertions = "1.4"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
test-log = { version = "0.2", default-features = false, features = ["trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = []
schema = ["sqlx_common", "sqlx/sqlite"]
sqlx_common = ["sqlx/any", "sqlx/runtime-tokio", "sqlx/macros", "sqlx/chrono"]
sqlite = ["rusqlite"]
postgresql = ["sqlx_common", "sqlx/postgres"]
mysql = ["sqlx_common", "sqlx/mysql"]
xml = ["roxmltree"]
decimal = ["rust_decimal"]

[[bench]]
name = "benchmark"
harness = false
required-features = ["sqlite", "xml"]

[[test]]
name = "sqlite"
path = "tests/sqlite.rs"
required-features = ["sqlite"]

[[test]]
name = "mysql"
path = "tests/mysql.rs"
required-features = ["mysql"]

[[test]]
name = "xml"
path = "tests/xml.rs"
required-features = ["xml"]

[[test]]
name = "postgresql"
path = "tests/postgresql.rs"
required-features = ["postgresql"]

[[test]]
name = "all"
path = "tests/all.rs"
required-features = ["sqlite", "postgresql", "mysql", "xml"]
